name: chebycodex-turkey-connector

services:
  connector:
    platform: linux/amd64
    image: ${CHEBY_CONNECTOR_IMAGE:?set the reviewed immutable Connector image ID}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    user: "10002:10002"
    environment:
      HOME: /home/cheby
      CODEX_HOME: /home/cheby/.codex
      # Fixed-IP production must not be redirected back through a stale public
      # bootstrap or Quick Tunnel value from an env file.
      CHEBY_CONNECTOR_RELAY_URL: ws://172.31.61.3:8080/relay/v1/node
      CHEBY_CONNECTOR_ID: ${CHEBY_CONNECTOR_ID:?set by install_node_bootstrap.py}
      CHEBY_CONNECTOR_RELAY_TOKEN_FILE: /run/secrets/node_token
      CHEBY_CONNECTOR_RUNTIME_PROFILE: production
      CHEBY_CONNECTOR_STATE: /data/connector.sqlite3
      CHEBY_CONNECTOR_HEALTH_PATH: /data/connector.health
      CHEBY_CONNECTOR_HEALTH_INTERVAL_SECONDS: "5"
      CHEBY_CONNECTOR_IDEMPOTENCY_RETENTION_SECONDS: "2592000"
      CHEBY_CONNECTOR_CONNECT_TIMEOUT_SECONDS: "10"
      CHEBY_CONNECTOR_REQUEST_TIMEOUT_SECONDS: "35"
      CHEBY_CONNECTOR_PING_INTERVAL_SECONDS: "20"
      CHEBY_CONNECTOR_PONG_TIMEOUT_SECONDS: "10"
      CHEBY_CONNECTOR_RECONNECT_BASE_SECONDS: "0.5"
      CHEBY_CONNECTOR_RECONNECT_MAX_SECONDS: "30"
      CHEBY_CONNECTOR_MAX_INBOUND_FRAME_BYTES: "12582912"
      CHEBY_CONNECTOR_MAX_OUTBOUND_FRAME_BYTES: "262144"
      CHEBY_CONNECTOR_MAX_CONCURRENCY: "4"
      CHEBY_GATEWAY_DB: /data/gateway.sqlite3
      CHEBY_BRIDGE_MODE: stdio
      # 0.144.6 Code Mode delegates tools back to an app-server client via
      # item/tool/call. The mobile Gateway exposes no generic client executor,
      # so keep 5.6-sol/xhigh on Codex's native tools.
      CHEBY_CODEX_COMMAND: python /app/deploy/codex_sandbox_launcher.py codex --ask-for-approval never app-server --disable code_mode_host --disable code_mode --listen stdio://
      CHEBY_CODEX_CWD: /workspace
      CHEBY_CODEX_FRAME_LIMIT_BYTES: "67108864"
      CHEBY_CODEX_REQUEST_TIMEOUT_SECONDS: "30"
      CHEBY_PROVISIONAL_THREAD_TTL_SECONDS: "3600"
      CHEBY_CODEX_EXPECTED_VERSION: "0.144.6"
      CHEBY_PAIRING_SECRET_FILE: /run/secrets/gateway_internal_secret
      CHEBY_LOCAL_IMAGE_ENABLED: "true"
      CHEBY_ASSET_STAGING_DIR: /asset-staging
      CHEBY_TRUSTED_PROXY_CIDRS: ""
      CHEBY_LOCAL_MCP_DATA_ROOT: /home/cheby/.codex/local-mcp
      CHEBY_PHONEBRIDGE_ENABLED: "true"
      CHEBY_PHONEBRIDGE_URL: http://127.0.0.1:3437
      CHEBY_PHONEBRIDGE_TOKEN_FILE: /run/secrets/phonebridge_local_token
      CHEBY_PHONEBRIDGE_BROKER_SOCKET: /home/cheby/.codex/runtime/phonebridge-broker.sock
      CHEBY_PHONEBRIDGE_ARTIFACT_DIR: /workspace/.cheby/phone-artifacts
      PHONEBRIDGE_ENV_FILE: /run/secrets/phonebridge.env
      PHONEBRIDGE_LOCAL_TOKEN_FILE: /run/secrets/phonebridge_local_token
      PHONEBRIDGE_LOCAL_TOKEN_CONTROLLER: chebycodex
      PHONEBRIDGE_MUTATION_CONTROLLER: chebycodex
    networks:
      outbound:
        ipv4_address: 172.30.0.2
      relay-backend:
        ipv4_address: 172.31.61.4
    ports:
      - "0.0.0.0:3448:3438/tcp"
    volumes:
      - type: bind
        source: ${CHEBY_CONNECTOR_DATA_DIR:?set the private persistent Connector data directory}
        target: /data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_CODEX_HOME_DIR:?set the private persistent Codex home directory}
        target: /home/cheby/.codex
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_WORKSPACE_DIR:?set the private Codex workspace directory}
        target: /workspace
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_ASSET_STAGING_DIR:?set the private asset staging directory}
        target: /asset-staging
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_CONNECTOR_NODE_TOKEN_PATH:?set by install_node_bootstrap.py}
        target: /run/secrets/node_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_CONNECTOR_GATEWAY_SECRET_PATH:?set by install_node_bootstrap.py}
        target: /run/secrets/gateway_internal_secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_PHONEBRIDGE_TOKEN_PATH:?set the private PhoneBridge local token file}
        target: /run/secrets/phonebridge_local_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_PHONEBRIDGE_ENV_PATH:?set the private merged PhoneBridge env file}
        target: /run/secrets/phonebridge.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_PHONEBRIDGE_CERTS_DIR:?set the private PhoneBridge certificate directory}
        target: /run/secrets/phonebridge-certs
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,uid=10002,gid=10002,mode=1777
      - /home/cheby/.cache:size=64m,uid=10002,gid=10002,mode=0700
      - /home/cheby/.config:size=16m,uid=10002,gid=10002,mode=0700
    security_opt:
      - no-new-privileges:true
      # The pinned profile is Docker's v26.1.3 default plus the reviewed
      # bubblewrap user-namespace and mount syscall exceptions. These calls are
      # broader than Docker's default; never replace the profile with
      # seccomp=unconfined.
      - seccomp=/etc/chebycodex-connector/codex-bwrap-seccomp.json
    cap_drop:
      - ALL
    pids_limit: 4096
    mem_limit: ${CHEBY_CONNECTOR_MEMORY:-18g}
    cpus: ${CHEBY_CONNECTOR_CPUS:-8.0}
    stop_grace_period: 45s

networks:
  outbound:
    name: chebycodex-turkey-connector_outbound
    driver: bridge
    internal: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/28
  relay-backend:
    name: chebycodex-relay-edge_relay-backend
    external: true
