name: chebycodex-relay-edge

services:
  relay:
    platform: linux/amd64
    image: ${CHEBY_RELAY_IMAGE:?set the reviewed immutable Relay image ID}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      CHEBY_RELAY_DB_PATH: /data/relay.sqlite3
      CHEBY_RELAY_ALLOWED_HOSTS: ${CHEBY_PUBLIC_IP:?set the fixed public IPv4 address},${CHEBY_RELAY_LEGACY_HOST:-},172.31.61.3,localhost,127.0.0.1
      CHEBY_RELAY_TRUSTED_PROXY_CIDRS: 172.31.61.2/32
      CHEBY_RELAY_CLIENT_IP_HEADER: x-relay-client-ip
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${CHEBY_RELAY_LOOPBACK_PORT:?set the Connector loopback port}:8080/tcp"
    networks:
      relay-loopback-publish:
        ipv4_address: 172.31.64.2
      relay-backend:
        ipv4_address: 172.31.61.3
    volumes:
      - type: bind
        source: ${CHEBY_RELAY_DATA_DIR:?set the private persistent Relay data directory}
        target: /data
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${CHEBY_RELAY_MEMORY:-1g}
    cpus: ${CHEBY_RELAY_CPUS:-1.0}
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 5

  edge:
    platform: linux/amd64
    image: ${CHEBY_RELAY_EDGE_IMAGE:?set the reviewed immutable Relay Edge image ID}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: "101:101"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "${CHEBY_BIND_IP:?set the ECS local IPv4 mapped to the EIP}:${CHEBY_RELAY_PUBLIC_PORT:?set 27461}:8443/tcp"
    networks:
      edge-ingress:
        ipv4_address: 172.31.60.2
      relay-backend:
        ipv4_address: 172.31.61.2
    volumes:
      - ./generated/nginx.production.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${CHEBY_RELAY_TLS_DIR:?set the private TLS release directory}
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  relay-gate:
    profiles: ["gate"]
    platform: linux/amd64
    image: ${CHEBY_RELAY_IMAGE:?set the reviewed immutable Relay image ID}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      CHEBY_RELAY_DB_PATH: /data/relay.sqlite3
      CHEBY_RELAY_ALLOWED_HOSTS: ${CHEBY_PUBLIC_IP:?set the fixed public IPv4 address},172.31.62.3,localhost,127.0.0.1
      CHEBY_RELAY_TRUSTED_PROXY_CIDRS: 172.31.62.2/32
      CHEBY_RELAY_CLIENT_IP_HEADER: x-relay-client-ip
      # Covers the 8-hour release soak plus its final cross-layer audit.
      CHEBY_RELAY_ACKED_PAYLOAD_RETENTION_SECONDS: "43200"
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${CHEBY_RELAY_GATE_LOOPBACK_PORT:?set the isolated Gate loopback port}:8080/tcp"
    networks:
      gate-relay-loopback-publish:
        ipv4_address: 172.31.65.2
      gate-backend:
        ipv4_address: 172.31.62.3
    volumes:
      - type: bind
        source: ${CHEBY_RELAY_GATE_DATA_DIR:?set the isolated Gate Relay data directory}
        target: /data
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 0.5
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 5

  edge-gate:
    profiles: ["gate"]
    platform: linux/amd64
    image: ${CHEBY_RELAY_EDGE_IMAGE:?set the reviewed immutable Relay Edge image ID}
    pull_policy: never
    restart: unless-stopped
    read_only: true
    user: "101:101"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    depends_on:
      relay-gate:
        condition: service_healthy
    ports:
      - "${CHEBY_BIND_IP:?set the ECS local IPv4 mapped to the EIP}:${CHEBY_RELAY_GATE_PORT:?set 27462}:8443/tcp"
    networks:
      gate-edge-ingress:
        ipv4_address: 172.31.63.2
      gate-backend:
        ipv4_address: 172.31.62.2
    volumes:
      - ./generated/nginx.gate.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${CHEBY_RELAY_TLS_DIR:?set the private TLS release directory}
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=32m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  relay-admin:
    profiles: ["admin"]
    platform: linux/amd64
    image: ${CHEBY_RELAY_IMAGE:?set the reviewed immutable Relay image ID}
    pull_policy: never
    init: true
    read_only: true
    user: "10001:10001"
    entrypoint: ["python", "-m", "cheby_relay.admin"]
    command: ["--help"]
    network_mode: none
    environment:
      CHEBY_RELAY_DB_PATH: /data/relay.sqlite3
      CHEBY_RELAY_ALLOWED_HOSTS: localhost
    volumes:
      - type: bind
        source: ${CHEBY_RELAY_DATA_DIR:?set the private persistent Relay data directory}
        target: /data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_RELAY_BOOTSTRAP_DIR:?set the private bootstrap output directory}
        target: /bootstrap
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25

  cert-tool:
    profiles: ["maintenance"]
    platform: linux/amd64
    image: ${CHEBY_RELAY_IMAGE:?set the reviewed immutable Relay image ID}
    pull_policy: never
    init: true
    read_only: true
    user: "101:101"
    entrypoint: ["python", "/opt/relay-edge/certificate_manager.py"]
    command: ["--help"]
    network_mode: none
    volumes:
      - ./certificate_manager.py:/opt/relay-edge/certificate_manager.py:ro
      - type: bind
        source: ${CHEBY_RELAY_TLS_DIR:?set the private TLS release directory}
        target: /tls
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_RELAY_CERT_STAGE_DIR:?set the private certificate staging directory}
        target: /staging
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  cert-consumer:
    profiles: ["maintenance"]
    platform: linux/amd64
    image: ${CHEBY_RELAY_IMAGE:?set the reviewed immutable Relay image ID}
    pull_policy: never
    init: true
    read_only: true
    user: "101:101"
    entrypoint: ["python", "/opt/relay-edge/certificate_manager.py"]
    command: ["--help"]
    network_mode: none
    volumes:
      - ./certificate_manager.py:/opt/relay-edge/certificate_manager.py:ro
      - type: bind
        source: ${CHEBY_RELAY_TLS_DIR:?set the private TLS release directory}
        target: /tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CHEBY_RELAY_CERT_STAGE_DIR:?set the private certificate staging directory}
        target: /staging
        read_only: false
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

  tls-monitor:
    profiles: ["maintenance"]
    platform: linux/amd64
    image: ${CHEBY_RELAY_IMAGE:?set the reviewed immutable Relay image ID}
    pull_policy: never
    init: true
    read_only: true
    user: "101:101"
    entrypoint: ["python", "/opt/relay-edge/monitor_tls.py"]
    command: ["--help"]
    network_mode: host
    volumes:
      - ./monitor_tls.py:/opt/relay-edge/monitor_tls.py:ro
      - type: bind
        source: ${CHEBY_RELAY_TLS_DIR:?set the private TLS release directory}
        target: /tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25

networks:
  edge-ingress:
    name: chebycodex-relay-edge_edge-ingress
    driver: bridge
    internal: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.60.0/28
  relay-backend:
    name: chebycodex-relay-edge_relay-backend
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.61.0/28
  relay-loopback-publish:
    name: chebycodex-relay-edge_relay-loopback-publish
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    internal: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.64.0/28
  gate-backend:
    name: chebycodex-relay-edge_gate-backend
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.62.0/28
  gate-relay-loopback-publish:
    name: chebycodex-relay-edge_gate-relay-loopback-publish
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    internal: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.65.0/28
  gate-edge-ingress:
    name: chebycodex-relay-edge_gate-edge-ingress
    driver: bridge
    internal: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.31.63.0/28
