name: verify

on:
  push:
  pull_request:

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source-delivery tests
        run: |
          python tools/standalone/test_delivery_apk_secret_scan.py
          python tools/standalone/test_delivery_license_ledger.py
          python tools/standalone/test_source_secret_scan.py
          python tools/standalone/test_create_source_snapshot.py
