[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chebycodex-gateway"
version = "0.1.0"
description = "Authenticated mobile gateway for a dedicated Codex app-server"
requires-python = ">=3.10"
dependencies = [
  "cryptography==49.0.0",
  "fastapi==0.139.2",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cheby_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
