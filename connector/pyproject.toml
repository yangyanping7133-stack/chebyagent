[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chebycodex-connector"
version = "0.1.0"
description = "Outbound-only Turkey connector for the ChebyCodex relay"
requires-python = ">=3.10"
dependencies = [
  "pydantic==2.13.4",
  "websockets==15.0.1",
]

[project.scripts]
chebycodex-connector = "cheby_connector.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cheby_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
